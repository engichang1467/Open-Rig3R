# Dataset configuration
dataset_type: "waymo"
waymo_path: "/data/waymo_mini"
waymo_cameras: null  # null means the full rig: FRONT, FRONT_LEFT, FRONT_RIGHT, SIDE_LEFT, SIDE_RIGHT
sequence_ids: null  # null means load all sequences, or provide list like ["segment_id_1", "segment_id_2"]

# Training configuration
batch_size: 4
num_workers: 4
epochs: 1 #50
n_frames: 2  # consecutive timestamps per sample; views = n_frames * num_cameras
image_size: [128, 128]
patch_size: 8  # must match the model; also sets the raymap target resolution

# Loss weights. The pointmap term is a metric MSE in metres (tens), the two raymap
# terms are cosine-based (bounded by 2), so leaving these equal lets depth dominate.
loss:
  w_point: 1.0
  w_pose: 1.0
  w_rig: 1.0

# Optimizer configuration
optimizer:
  lr: 0.0001
  weight_decay: 0.01

# Scheduler configuration
scheduler:
  T_max: 50
  eta_min: 0.000001

# Device
device: "cuda"

# Metadata dropout (for co3d, not used in waymo)
metadata_dropout: 0.5