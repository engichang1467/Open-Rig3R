# Dataset configuration
dataset_type: "waymo"
waymo_path: "/data/waymo_mini"
waymo_cameras: null  # null means the full rig: FRONT, FRONT_LEFT, FRONT_RIGHT, SIDE_LEFT, SIDE_RIGHT
sequence_ids: null  # null means load all sequences, or provide list like ["segment_id_1", "segment_id_2"]

# Training configuration
batch_size: 4
num_workers: 4
epochs: 1 #50
n_frames: 2  # consecutive timestamps per sample; views = n_frames * num_cameras
image_size: [128, 128]
patch_size: 16  # fixed by the DUSt3R ViT-L/16 encoder; also sets the raymap target resolution

# Loss weights. Every term is scale-free now that the ground truth is divided by the
# average scene depth (Eq. 3, Eq. 4), so these compare like with like.
loss:
  w_point: 1.0
  w_pose: 1.0
  w_rig: 1.0
  alpha: 0.2  # Eq. 3 confidence regularizer. Not given in the paper; DUSt3R's value.
  beta: 1.0   # Eq. 4 camera-centre weight. Not given in the paper.

# Optimizer configuration
optimizer:
  lr: 0.0001
  weight_decay: 0.01

# Scheduler configuration. T_max defaults to `epochs` - set it only to deliberately
# traverse a fraction of the cosine period.
scheduler:
  eta_min: 0.000001

# Device
device: "cuda"

# Per-field embedding dropout in the decoder, applied to every dataset. The frame
# index is exempt: sec 3.3 always includes it.
metadata_dropout: 0.5
# Reproducibility: same seed = same init, same shuffle, same metadata dropout
seed: 0

# Autocast dtype. Left unset it picks bf16 on Ampere or newer and falls back to
# fp16 + GradScaler below that. Set it to force a choice, e.g. "float16" to
# reproduce a pre-bf16 run, or "float32" to rule AMP out while debugging.
# amp_dtype: float16
