# Dataset configuration
dataset_type: "waymo"
waymo_path: "/data/waymo_mini"
waymo_cameras: null  # null means the full 5-camera rig
sequence_ids: null

# Training configuration
batch_size: 128
num_workers: 4
epochs: 50
n_frames: 24  # consecutive timestamps per sample; views = n_frames * num_cameras
image_size: [128, 128]
patch_size: 8  # must match the model; also sets the raymap target resolution

# Optimizer configuration
optimizer:
  lr: 0.0001
  weight_decay: 0.01

# Scheduler configuration
scheduler:
  T_max: 50
  eta_min: 0.000001

# Device
device: "cuda"

# Metadata dropout
metadata_dropout: 0.5